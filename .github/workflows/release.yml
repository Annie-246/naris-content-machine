name: Đóng gói app

# Máy Windows không dựng được bộ cài macOS (electron-builder cần chính macOS để
# tạo .dmg), nên bản Mac dựng ở đây, trên máy macOS của GitHub. Đẩy một tag dạng
# v1.0.0 là workflow chạy và đính kèm cả hai bản vào Releases.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            command: npx electron-builder --win --publish never
          - os: macos-latest
            name: macOS
            command: npx electron-builder --mac --publish never

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Chạy test
        run: npm test

      - name: Build giao diện
        run: npm run build

      - name: Tải yt-dlp và ffmpeg cho hệ điều hành này
        run: node scripts/fetch-vendor.mjs

      # electronDist trỏ vào node_modules/electron/dist - đúng trên máy đã cài
      # đặt sẵn, nhưng trên runner macOS thư mục đó có thể chưa giải nén, và
      # electron-builder tự tải bản đúng kiến trúc nếu ta không ép đường dẫn.
      - name: Gỡ electronDist trên macOS
        if: matrix.os == 'macos-latest'
        run: node -e "const f='package.json',p=require('./'+f);delete p.build.electronDist;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - name: Đóng gói
        run: ${{ matrix.command }}

      - name: Giữ lại bản đóng gói
        uses: actions/upload-artifact@v4
        with:
          name: naris-content-machine-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Đưa lên Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
          draft: false
          generate_release_notes: true
          body: |
            ## Tải về

            - **Windows**: `Naris.Content.Machine.Setup.<phiên bản>.exe` (bản cài) hoặc `Naris.Content.Machine.<phiên bản>.exe` (chạy ngay).
              Windows báo "Windows protected your PC" thì bấm *More info* → *Run anyway*.
            - **macOS**: `.dmg` — máy chip Apple (M1/M2/M3...) tải bản `arm64`, máy Intel tải bản `x64`.
              Mở lần đầu phải **chuột phải vào app → Open → Open**, vì app chưa mua chứng chỉ Apple.

            Sau khi mở app, vào mục **Tích hợp** dán API key Gemini (lấy miễn phí tại https://aistudio.google.com/apikey).
